services:
  - type: web
    name: creator-dashboard
    runtime: node
    plan: free
    # Install everything (Vite/TS are devDeps needed at build time), then build the React app.
    # --ignore-scripts skips Puppeteer's heavy Chromium download (screenshots are
    # not used by the v2 UI); the app still boots fine without it.
    buildCommand: npm install --ignore-scripts && npm run build
    startCommand: node server.cjs
    envVars:
      - key: YOUTUBE_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: NODE_ENV
        value: production
